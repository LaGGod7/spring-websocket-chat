<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WS</title>
    <style>
        *{
            color: black;
        }
    </style>
</head>
<body>
<div id="usernamePage">

    <h1>ENTER YOUR USERNAME</h1>

    <form id="usernameForm">

        <input
                id="name"
                placeholder="Enter username"
        >

        <button type="submit">
            Join
        </button>

    </form>

</div>


<div id="chatPage" style="display: none;">

    <ul id="messageArea"></ul>

    <form id="messageForm">
        <input
                id="message"
                placeholder="Type a message"
        />

        <button type="submit">
            Send
        </button>
    </form>

</div>
<div id="userList">
    <h3>Online Users</h3>
    <ul id="users"></ul>
    <button onclick="sendPrivateMessage()">
        Send Private Message to Rahul
    </button>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/main.js"></script>

</body>
</html>
